schema_version: 1

context:
  python_min: "3.11"
  version: "0.0.4"

package:
  name: ramp-batman
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/r/ramp-batman/ramp_batman-${{ version }}.tar.gz
  sha256: 32769ba99f9485933d05d38d2c875877e77c656f9b876ade86be6d54114bd9b6

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools
    - setuptools-scm
    - wheel
    - pip
  run:
    - python >=${{ python_min }}
    - dask-core
    - matplotlib-base
    - more-itertools
    - multipledispatch
    - networkx
    - numpy
    - ramp-coremaker
    - ramp-endf
    - ramp-isotopes
    - ramp-reactions
    - scipy
    - toolz

tests:
  - python:
      imports:
        - batman
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Package for solving reactions and decays by Bateman's equation
  license: MIT
  license_file: LICENSE
  homepage: https://pypi.org/project/ramp-batman/

extra:
  recipe-maintainers:
    - esheder
